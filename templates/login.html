{% extends "base.html" %}

{% block title %}Login - Smart Study{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-header">
    <h1>Welcome Back</h1>
    <p>Log in to continue to your study workspace</p>
  </div>

  <div class="card">
    <form action="{{ url_for('login', next=request.args.get('next')) }}" method="POST">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="you@university.edu" value="{{ email or '' }}" required autofocus>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.375rem;">
          <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
        </div>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem;">Login to Smart Study</button>
    </form>
  </div>

  <div class="auth-footer">
    Don't have an account? <a href="{{ url_for('register') }}" style="font-weight: 600;">Create an account</a>
  </div>
</div>
{% endblock %}
