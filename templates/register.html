{% extends "base.html" %}

{% block title %}Register - Smart Study{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-header">
    <h1>Create Student Account</h1>
    <p>Get started with your free Smart Study AI Companion</p>
  </div>

  <div class="card">
    <form action="{{ url_for('register') }}" method="POST">
      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="Alex Johnson" value="{{ name or '' }}" required autofocus>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="alex@university.edu" value="{{ email or '' }}" required>
        <div class="form-hint">Used to access your saved notes and quizzes safely.</div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="At least 6 characters" required>
      </div>

      <div class="form-group">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem;">Create Account</button>
    </form>
  </div>

  <div class="auth-footer">
    Already have an account? <a href="{{ url_for('login') }}" style="font-weight: 600;">Log in here</a>
  </div>
</div>
{% endblock %}
